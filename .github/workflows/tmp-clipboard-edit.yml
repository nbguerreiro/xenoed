name: Temporary clipboard key edit

on:
  push:
    branches:
      - todo-1-clipboard-keys

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add insert-mode clipboard bindings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/editor.c')
          s = p.read_text()
          old = '''    unsigned char c0 = (unsigned char)text[0];\n    if (c0 < 0x20 && c0 != '\\t') return;\n    if (c0 == 0x7F) return;'''
          new = '''    unsigned char c0 = (unsigned char)text[0];\n    if (c0 == 0x18) {\n        editor_cut_selection(ed);\n        return;\n    }\n    if (c0 == 0x03) {\n        editor_yank_selection(ed);\n        return;\n    }\n    if (c0 == 0x16) {\n        ed->paste_requested = 1;\n        return;\n    }\n    if (c0 < 0x20 && c0 != '\\t') return;\n    if (c0 == 0x7F) return;'''
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/editor.c
          git commit -m 'feat: add insert-mode clipboard shortcuts'
          git push